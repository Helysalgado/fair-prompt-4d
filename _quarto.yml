project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - contenido/*.qmd
    - contenido/interactivos/explorador-fair.qmd
    - contenido/interactivos/que-falta-por-definir.qmd
    - contenido/interactivos/de-la-solicitud-al-prompt.qmd
    - contenido/interactivos/que-puedo-aceptar.qmd
