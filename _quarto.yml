format:
  html:
    theme:
      - cosmo
      - tema.scss
    css: styles.css
    include-after-body:
      - _prompt-copy.html
      - includes/cloudflare-analytics.html
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "En esta página"
    number-sections: false
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto
