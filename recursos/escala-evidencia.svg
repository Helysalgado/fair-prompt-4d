<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1080" height="430" fill="#f6f8fb"/><text x="40" y="46" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#123b69" text-anchor="start">Cuatro etiquetas para cada afirmación</text><text x="40" y="72" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#53677a" text-anchor="start">Úsalas en el diagnóstico (P5–P6) y en tu bitácora: cada afirmación lleva una</text><rect x="40" y="100" width="235" height="262" rx="12" fill="#e9f0f8" stroke="#cdd8e3" stroke-width="1.5"/><rect x="40" y="100" width="235" height="6" rx="3" fill="#123b69"/><text x="58" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#123b69" text-anchor="start">Observado</text><text x="58" y="168" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#53677a" text-anchor="start">Está en el archivo y se puede</text><text x="58" y="187" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#53677a" text-anchor="start">señalar</text><text x="58" y="218" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#53677a" text-anchor="start">EJEMPLO DEL CASO</text><text x="58" y="239" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">«La columna C se llama Estrés</text><text x="58" y="258" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">A (prom.)»</text><line x1="58" y1="304" x2="257" y2="304" stroke="#cdd8e3"/><text x="58" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#53677a" text-anchor="start">QUÉ HACER</text><text x="58" y="348" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#123b69" text-anchor="start">Cita la hoja y la celda</text><rect x="288" y="100" width="235" height="262" rx="12" fill="#fff6df" stroke="#cdd8e3" stroke-width="1.5"/><rect x="288" y="100" width="235" height="6" rx="3" fill="#9a7428"/><text x="306" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a7428" text-anchor="start">Inferido</text><text x="306" y="168" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#53677a" text-anchor="start">Es plausible, pero el archivo</text><text x="306" y="187" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#53677a" text-anchor="start">no lo dice</text><text x="306" y="218" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#53677a" text-anchor="start">EJEMPLO DEL CASO</text><text x="306" y="239" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">«prom. probablemente</text><text x="306" y="258" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">significa promedio»</text><line x1="306" y1="304" x2="505" y2="304" stroke="#cdd8e3"/><text x="306" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#53677a" text-anchor="start">QUÉ HACER</text><text x="306" y="348" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#9a7428" text-anchor="start">Márcalo como hipótesis</text><rect x="536" y="100" width="235" height="262" rx="12" fill="#fdf1ec" stroke="#cdd8e3" stroke-width="1.5"/><rect x="536" y="100" width="235" height="6" rx="3" fill="#b4532a"/><text x="554" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b4532a" text-anchor="start">Por confirmar</text><text x="554" y="168" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#53677a" text-anchor="start">Solo puede responderlo quien</text><text x="554" y="187" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#53677a" text-anchor="start">generó los datos</text><text x="554" y="218" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#53677a" text-anchor="start">EJEMPLO DEL CASO</text><text x="554" y="239" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">«¿Promedio de cuántas</text><text x="554" y="258" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">réplicas?»</text><line x1="554" y1="304" x2="753" y2="304" stroke="#cdd8e3"/><text x="554" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#53677a" text-anchor="start">QUÉ HACER</text><text x="554" y="348" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b4532a" text-anchor="start">Pregúntalo a la responsable</text><rect x="784" y="100" width="235" height="262" rx="12" fill="#e7f2ef" stroke="#cdd8e3" stroke-width="1.5"/><rect x="784" y="100" width="235" height="6" rx="3" fill="#2e7d6b"/><text x="802" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#2e7d6b" text-anchor="start">Verificado</text><text x="802" y="168" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#53677a" text-anchor="start">Lo comprobaste abriendo una</text><text x="802" y="187" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#53677a" text-anchor="start">fuente primaria</text><text x="802" y="218" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#53677a" text-anchor="start">EJEMPLO DEL CASO</text><text x="802" y="239" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">«Los principios FAIR están</text><text x="802" y="258" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">enumerados en el Box 2 de</text><text x="802" y="277" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#183047" text-anchor="start" font-style="italic">Wilkinson et al. (2016)»</text><line x1="802" y1="304" x2="1001" y2="304" stroke="#cdd8e3"/><text x="802" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#53677a" text-anchor="start">QUÉ HACER</text><text x="802" y="348" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2e7d6b" text-anchor="start">Anota fuente, pasaje y fecha</text><text x="540.0" y="400" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#123b69" text-anchor="middle">La IA puede ayudarte a clasificar (P6), pero «Verificado» solo lo escribes tú, después de leer la fuente.</text></svg>