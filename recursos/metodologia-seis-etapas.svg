<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 683" width="1080" height="683"><rect width="1080" height="683" fill="#f6f8fb"/><text x="60" y="62" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#123b69" text-anchor="start">ANTES DEL PROMPT · Proceso de trabajo científico con IA</text><rect x="60" y="100" width="460" height="125" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="98" cy="144" r="23" fill="#123b69"/><text x="98" y="151" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">1</text><text x="138" y="144" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183047" text-anchor="start">Expreso mi necesidad</text><text x="138" y="179" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#53677a" text-anchor="start">Aunque todavía sea imprecisa</text><rect x="570" y="100" width="460" height="125" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="608" cy="144" r="23" fill="#123b69"/><text x="608" y="151" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text><text x="648" y="144" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183047" text-anchor="start">Exploro y aprendo</text><text x="648" y="179" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#53677a" text-anchor="start">Conceptos, vocabulario y fuentes</text><rect x="60" y="270" width="460" height="125" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="98" cy="314" r="23" fill="#123b69"/><text x="98" y="321" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="138" y="314" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183047" text-anchor="start">Delimito y especifico</text><text x="138" y="349" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#53677a" text-anchor="start">Objetivo, datos y resultado esperado</text><rect x="570" y="270" width="460" height="125" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="608" cy="314" r="23" fill="#c49b43"/><text x="608" y="321" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="648" y="314" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183047" text-anchor="start">Decido cómo colaborar</text><text x="648" y="349" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#53677a" text-anchor="start">Qué delego y qué superviso (4D)</text><rect x="60" y="440" width="460" height="125" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="98" cy="484" r="23" fill="#c49b43"/><text x="98" y="491" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="138" y="484" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183047" text-anchor="start">Obtengo y verifico</text><text x="138" y="519" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#53677a" text-anchor="start">Contrasto resultados y corrijo</text><rect x="570" y="440" width="460" height="125" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.5"/><circle cx="608" cy="484" r="23" fill="#c49b43"/><text x="608" y="491" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">6</text><text x="648" y="484" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183047" text-anchor="start">Documento decisiones</text><text x="648" y="519" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#53677a" text-anchor="start">Fuentes, límites y próximos pasos</text><text x="60" y="646" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#53677a" text-anchor="start">Iterativo: una v