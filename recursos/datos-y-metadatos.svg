<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1080" height="520" fill="#f6f8fb"/><text x="40" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#123b69" text-anchor="start">¿Qué nos dice realmente el archivo de expresión?</text><rect x="40" y="78" width="490" height="365" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.5"/><text x="65" y="116" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#123b69" text-anchor="start">OBSERVABLE</text><text x="65" y="140" font-family="Arial, sans-serif" font-size="14.5" font-weight="400" fill="#53677a" text-anchor="start">Se puede ver y señalar en el archivo (hoja/celda)</text><rect x="60" y="162" width="450" height="48" rx="10" fill="#e9f0f8" stroke="#cdd8e3" stroke-width="1.2"/><text x="82" y="193" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#123b69" text-anchor="start">✓</text><text x="108" y="184" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">5 filas con identificadores de gen</text><text x="108" y="202" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">recA, rpoS, b0014, katG, dnaK</text><rect x="60" y="216" width="450" height="48" rx="10" fill="#e9f0f8" stroke="#cdd8e3" stroke-width="1.2"/><text x="82" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#123b69" text-anchor="start">✓</text><text x="108" y="238" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">3 columnas de condiciones</text><text x="108" y="256" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">Control · Estrés A (prom.) · Estrés B</text><rect x="60" y="270" width="450" height="48" rx="10" fill="#e9f0f8" stroke="#cdd8e3" stroke-width="1.2"/><text x="82" y="301" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#123b69" text-anchor="start">✓</text><text x="108" y="292" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">1 celda vacía</text><text x="108" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">b0014 en Estrés B</text><rect x="60" y="324" width="450" height="48" rx="10" fill="#e9f0f8" stroke="#cdd8e3" stroke-width="1.2"/><text x="82" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#123b69" text-anchor="start">✓</text><text x="108" y="346" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">Hoja de notas parciales</text><text x="108" y="364" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">Organismo, «valores procesados», réplicas sin registro</text><rect x="60" y="378" width="450" height="48" rx="10" fill="#e9f0f8" stroke="#cdd8e3" stroke-width="1.2"/><text x="82" y="409" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#123b69" text-anchor="start">✓</text><text x="108" y="400" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">Aviso de datos ficticios</text><text x="108" y="418" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">Visible en la primera hoja</text><rect x="550" y="78" width="490" height="365" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.5"/><text x="575" y="116" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#123b69" text-anchor="start">REQUIERE CONFIRMACIÓN</text><text x="575" y="140" font-family="Arial, sans-serif" font-size="14.5" font-weight="400" fill="#53677a" text-anchor="start">Solo puede responderlo quien generó los datos o una fuente</text><rect x="570" y="162" width="450" height="48" rx="10" fill="#fff6df" stroke="#cdd8e3" stroke-width="1.2"/><text x="592" y="193" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b4532a" text-anchor="start">?</text><text x="618" y="184" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">Unidades y técnica</text><text x="618" y="202" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">¿Conteos, TPM, intensidad…? ¿Qué método?</text><rect x="570" y="216" width="450" height="48" rx="10" fill="#fff6df" stroke="#cdd8e3" stroke-width="1.2"/><text x="592" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b4532a" text-anchor="start">?</text><text x="618" y="238" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">Significado de Estrés A / B y «prom.»</text><text x="618" y="256" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">¿Qué tratamiento? ¿Promedio de qué?</text><rect x="570" y="270" width="450" height="48" rx="10" fill="#fff6df" stroke="#cdd8e3" stroke-width="1.2"/><text x="592" y="301" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b4532a" text-anchor="start">?</text><text x="618" y="292" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">Réplicas, cepa y procesamiento</text><text x="618" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">Ni el número ni el protocolo están registrados</text><rect x="570" y="324" width="450" height="48" rx="10" fill="#fff6df" stroke="#cdd8e3" stroke-width="1.2"/><text x="592" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b4532a" text-anchor="start">?</text><text x="618" y="346" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">Sistema de identificadores</text><text x="618" y="364" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">¿Qué genoma y anotación de referencia?</text><rect x="570" y="378" width="450" height="48" rx="10" fill="#fff6df" stroke="#cdd8e3" stroke-width="1.2"/><text x="592" y="409" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b4532a" text-anchor="start">?</text><text x="618" y="400" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#183047" text-anchor="start">Motivo de la celda vacía</text><text x="618" y="418" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53677a" text-anchor="start">¿Ausente, no aplicable o perdido? No equivale a 0</text><text x="540.0" y="482" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b4532a" text-anchor="middle">Regla: no convertir la ausencia de metadatos en hechos inventados.</text></svg>