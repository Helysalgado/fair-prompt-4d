<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1080" height="500" fill="#f6f8fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#123b69" text-anchor="start">Revisar no es verificar</text><rect x="40" y="72" width="480" height="300" rx="14" fill="white" stroke="#cdd8e3" stroke-width="1.8"/><rect x="64" y="92" width="44" height="28" rx="14" fill="#c49b43"/><text x="76" y="112" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="start">P6</text><text x="64" y="152" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#123b69" text-anchor="start">Autorrevisión de la IA</text><text x="64" y="176" font-family="Arial, sans-serif" font-size="14.5" font-weight="400" fill="#53677a" text-anchor="start">La IA relee su propia respuesta</text><circle cx="74" cy="203" r="4" fill="#c49b43"/><text x="88" y="208" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#183047" text-anchor="start">Clasifica: observado, inferido, por confirmar</text><circle cx="74" cy="231" r="4" fill="#c49b43"/><text x="88" y="236" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#183047" text-anchor="start">Corrige «no existe» por «no está documentado»</text><circle cx="74" cy="259" r="4" fill="#c49b43"/><text x="88" y="264" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#183047" text-anchor="start">Sugiere qué fuente y sección revisar</text><rect x="60" y="306" width="440" height="50" rx="10" fill="#e9f0f8" stroke="#cdd8e3" stroke-width="1.2"/><text x="76" y="326" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#53677a" text-anchor="start">Resultado</text><text x="76" y="346" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#183047" text-anchor="start">Una lista de lo que habría que comprobar</text><rect x="560" y="72" width="480" height="300" rx="14" fill="white" stroke="#c49b43" stroke-width="1.8"/><rect x="584" y="92" width="44" height="28" rx="14" fill="#123b69"/><text x="596" y="112" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="start">Tú</text><text x="584" y="152" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#123b69" text-anchor="start">Verificación independiente</text><text x="584" y="176" font-family="Arial, sans-serif" font-size="14.5" font-weight="400" fill="#53677a" text-anchor="start">Una persona consulta la fuente primaria</text><circle cx="594" cy="203" r="4" fill="#123b69"/><text x="608" y="208" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#183047" text-anchor="start">Abre y lee la fuente (Wilkinson et al., 2016)</text><circle cx="594" cy="231" r="4" fill="#123b69"/><text x="608" y="236" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#183047" text-anchor="start">Localiza el pasaje concreto</text><circle cx="594" cy="259" r="4" fill="#123b69"/><text x="608" y="264" font-family="Arial, sans-serif" font-size="15.5" font-weight="400" fill="#183047" text-anchor="start">Anota fecha, interpretación y limitaciones</text><rect x="580" y="306" width="440" height="50" rx="10" fill="#fff6df" stroke="#cdd8e3" stroke-width="1.2"/><text x="596" y="326" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#53677a" text-anchor="start">Resultado</text><text x="596" y="346" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#183047" text-anchor="start">«Respalda», «contradice» o «no permite decidir»</text><text x="540" y="232" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#b4532a" text-anchor="middle">≠</text><path d="M280 374 V398 H540" stroke="#53677a" stroke-width="2" fill="none"/><path d="M800 374 V398 H540" stroke="#53677a" stroke-width="2" fill="none"/><path d="M540 398 V410" stroke="#53677a" stroke-width="2"/><path d="M532 408 l8 10 l8 -10 z" fill="#53677a"/><rect x="380" y="422" width="320" height="50" rx="12" fill="#e9f0f8" stroke="#cdd8e3" stroke-width="1.5"/><text x="540" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#123b69" text-anchor="middle">Bitácora</text><text x="540" y="463" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b4532a" text-anchor="middle">Si no abriste la fuente: «pendiente»</text></svg>